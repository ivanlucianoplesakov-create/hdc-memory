<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Company Memory</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111">
<style>body{font-family:system-ui;background:#111;color:#eee;margin:0;padding:16px;max-width:600px;margin:auto}
textarea{width:100%;height:150px;font-size:18px;padding:12px;border-radius:10px;border:1px solid #444;background:#1c1c1c;color:#fff;box-sizing:border-box}
button{font-size:18px;padding:14px;border-radius:10px;border:0;margin:8px 4px 8px 0;color:#fff}
#log{background:#2b7a3d}#ask{background:#2f5fb3}#out{margin-top:14px;padding:12px;background:#1c1c1c;border-radius:10px;min-height:40px;white-space:pre-wrap}
small{color:#999}</style></head><body>
<h2>Company Memory</h2>
<textarea id="t" placeholder="Tap here, then tap the mic on your keyboard and speak"></textarea>
<button id="log">Save note</button><button id="ask">Ask</button>
<div id="out"></div><p><small><a href="#" id="k" style="color:#999">change key</a></small></p>
<script>
const U="https://vrcddtbmyjbokcbugmly.supabase.co/functions/v1/memory-log";
const t=document.getElementById('t'),o=document.getElementById('out');
function key(){let k=localStorage.getItem('mk');if(!k){k=prompt('Paste your secret key (one time)');if(k)localStorage.setItem('mk',k.trim());}return k;}
async function go(mode){const text=t.value.trim();if(!text)return;const k=key();if(!k)return;o.textContent='...';
try{const r=await fetch(U,{method:'POST',headers:{'x-api-key':k,'Content-Type':'application/json'},body:JSON.stringify({text,mode})});
const m=await r.text();o.textContent=r.status==403?'Wrong key. Tap "change key".':m;if(r.ok&&mode==='log')t.value='';}catch(e){o.textContent='Network error';}}
log.onclick=()=>go('log');ask.onclick=()=>go('ask');
k.onclick=e=>{e.preventDefault();localStorage.removeItem('mk');key();};
</script></body></html>
